<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truck Weather</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-primary bg-gradient">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg border-0">
            <div class="card-body text-center p-4">
              <h1 class="display-5 mb-3">🌤️ Just A Craving Weather</h1>

              <p class="lead text-muted">
                Check today's food truck weather conditions
              </p>

              <button id="check-btn" class="btn btn-warning btn-lg mb-4">
                Check the Weather
              </button>

              <div id="weather" class="mt-3">
                <!-- Weather data appears here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
